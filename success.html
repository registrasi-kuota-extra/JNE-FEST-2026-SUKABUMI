<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0B14">
<title>Pembayaran Berhasil — JNS Festival 2026</title>
<link rel="icon" type="image/png" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
  :root {
    --bg-main: #0B0B14;
    --success: #10B981;
    --success-glow: rgba(16, 185, 129, 0.4);
    --gold: #F5C842;
    --card-bg: rgba(255,255,255,0.03);
    --card-border: rgba(255,255,255,0.08);
    --text-muted: #9CA3AF;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: var(--bg-main);
    color: #fff;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
    text-align: center;
    position: relative; overflow: hidden;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(900px circle at 50% 20%, rgba(16, 185, 129, 0.18), transparent 50%),
      radial-gradient(700px circle at 80% 80%, rgba(245, 200, 66, 0.1), transparent 50%),
      linear-gradient(180deg, #0B1F18, #0B0B14);
    z-index: -2;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
    background-size: 50px 50px;
    z-index: -1;
    -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
  }

  .success-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 24px;
    padding: 40px 30px;
    max-width: 500px; width: 100%;
    backdrop-filter: blur(10px);
    animation: fadeUp 0.8s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .success-icon {
    width: 100px; height: 100px;
    background: linear-gradient(135deg, var(--success), #059669);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 24px;
    box-shadow: 0 12px 40px var(--success-glow);
    animation: popIn 0.6s cubic-bezier(.2,1.4,.4,1) 0.2s backwards;
    position: relative;
  }
  @keyframes popIn {
    from { transform: scale(0); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .success-icon::before, .success-icon::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--success);
  }
  .success-icon::before {
    inset: -10px; opacity: 0.4;
    animation: pulseRing 2.2s infinite;
  }
  .success-icon::after {
    inset: -20px; opacity: 0.2;
    animation: pulseRing 2.2s infinite 0.4s;
  }
  @keyframes pulseRing {
    0% { transform: scale(0.85); opacity: 0.6; }
    100% { transform: scale(1.3); opacity: 0; }
  }
  .success-icon i {
    font-size: 48px; color: #fff;
  }

  .success-card h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px; font-weight: 800;
    color: #fff;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
  }
  .success-card h1 .grad {
    background: linear-gradient(135deg, var(--success), var(--gold));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .success-card p {
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
    margin-bottom: 24px;
  }

  .order-info {
    background: rgba(255,255,255,0.04);
    border: 1px dashed rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 24px;
  }
  .order-info-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 6px 0;
    font-size: 13px;
  }
  .order-info-row + .order-info-row {
    border-top: 1px solid rgba(255,255,255,0.05);
  }
  .order-info-row .label { color: var(--text-muted); }
  .order-info-row .value {
    color: #fff; font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
  }
  .order-info-row .value.gold { color: var(--gold); }

  .btn-group {
    display: flex; gap: 10px; flex-wrap: wrap;
  }
  .btn {
    flex: 1; min-width: 140px;
    padding: 14px 20px;
    border: none; border-radius: 12px;
    font-size: 13px; font-weight: 700;
    cursor: pointer; text-decoration: none;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: 0.25s;
    font-family: inherit;
  }
  .btn-primary {
    background: linear-gradient(135deg, var(--success), #059669);
    color: #fff;
    box-shadow: 0 6px 20px var(--success-glow);
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px var(--success-glow); }
  .btn-secondary {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
  }
  .btn-secondary:hover { background: rgba(255,255,255,0.12); transform: translateY(-2px); }

  .info-note {
    margin-top: 18px;
    font-size: 12px;
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .info-note i { color: var(--gold); }

  @media (max-width: 480px) {
    .success-card { padding: 30px 20px; }
    .success-card h1 { font-size: 24px; }
    .btn-group { flex-direction: column; }
    .btn { min-width: auto; }
  }
</style>
</head>
<body>

<div class="success-card">
  <div class="success-icon">
    <i class="fa-solid fa-check"></i>
  </div>
  <h1>Pembayaran <span class="grad">Berhasil!</span></h1>
  <p>Terima kasih! Pembayaran Anda telah kami terima. E-Tiket akan dikirim ke email Anda dalam beberapa menit.</p>

  <div class="order-info">
    <div class="order-info-row">
      <span class="label">Order ID</span>
      <span class="value gold" id="orderId">JNS-000000</span>
    </div>
    <div class="order-info-row">
      <span class="label">Nama Pemesan</span>
      <span class="value" id="namaPemesan">-</span>
    </div>
    <div class="order-info-row">
      <span class="label">Total Pembayaran</span>
      <span class="value gold" id="totalBayar">Rp 0</span>
    </div>
    <div class="order-info-row">
      <span class="label">Status</span>
      <span class="value" style="color: var(--success);"><i class="fa-solid fa-circle-check"></i> LUNAS</span>
    </div>
  </div>

  <div class="btn-group">
    <a href="index.html" class="btn btn-secondary">
      <i class="fa-solid fa-house"></i> Beranda
    </a>
    <a href="https://wa.me/62895627108514" target="_blank" rel="noopener" class="btn btn-primary">
      <i class="fa-brands fa-whatsapp"></i> Hubungi CS
    </a>
  </div>

  <div class="info-note">
    <i class="fa-solid fa-envelope-circle-check"></i>
    Cek folder spam jika e-tiket tidak masuk dalam 5 menit.
  </div>
</div>

<script>
  // Tampilkan info order dari sessionStorage (karena localStorage sudah di-clear)
  'use strict';
  
  try {
    // Ambil data order terakhir dari sessionStorage sebagai fallback display
    const lastOrder = sessionStorage.getItem('jns_last_order');
    if (lastOrder) {
      const order = JSON.parse(lastOrder);
      document.getElementById('orderId').textContent = order.order_id || 'JNS-000000';
      document.getElementById('namaPemesan').textContent = order.nama || '-';
      document.getElementById('totalBayar').textContent = 'Rp ' + Number(order.total_bayar || 0).toLocaleString('id-ID');
    }
    
    // Cleanup semua data flow
    sessionStorage.removeItem('jns_order_id');
    sessionStorage.removeItem('jns_flow_step');
    sessionStorage.removeItem('jns_last_order');
    localStorage.removeItem('jns_order');
    localStorage.removeItem('jns_order_id');
    localStorage.removeItem('jns_draft');
  } catch(e) {
    console.warn('Cleanup error:', e);
  }
</script>

</body>
</html>
